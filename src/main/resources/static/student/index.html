<!doctype html>
<html lang="pl" data-bs-theme="dark">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>FreeEdu – Uczeń</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<header class="container py-4 d-flex justify-content-between align-items-center">
    <a class="navbar-brand fw-bold fs-4" href="/">FreeEdu</a>
    <div class="d-flex align-items-center gap-2">
        <nav id="userBanner" class="small"></nav>
        <button id="themeToggle" class="theme-toggle ms-auto">🌙 ciemny</button>
    </div>
</header>

<main class="container pb-5">
    <div class="row g-4">
        <aside class="col-lg-3">
            <div class="card-glass p-3">
                <h2 class="h6 text-uppercase text-secondary mb-3">Nawigacja</h2>
                <div class="list-group">
                    <a class="list-group-item list-group-item-action" href="#schedule">
                        <i class="bi bi-calendar3 me-2"></i>Plan lekcji
                    </a>
                    <a class="list-group-item list-group-item-action" href="#grades">
                        <i class="bi bi-mortarboard me-2"></i>Oceny
                    </a>
                    <a class="list-group-item list-group-item-action" href="#attendance">
                        <i class="bi bi-clipboard-check me-2"></i>Frekwencja
                    </a>
                    <a class="list-group-item list-group-item-action" href="#remarks">
                        <i class="bi bi-chat-text me-2"></i>Uwagi
                    </a>
                </div>
            </div>
        </aside>

        <section class="col-lg-9">
            <div id="view"></div>
        </section>
    </div>
</main>

<!-- Templates -->
<template id="tpl-schedule">
    <div class="card-glass p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Plan lekcji</h2>
            <div id="studentBadgeSchedule" class="badge text-bg-secondary"></div>
        </div>
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
                <thead><tr>
                    <th>Data</th><th>Przedmiot</th><th>Nauczyciel</th><th>Klasa</th>
                </tr></thead>
                <tbody id="scheduleTbody"></tbody>
            </table>
        </div>
    </div>
</template>

<template id="tpl-grades">
    <div class="card-glass p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Oceny</h2>
            <div id="studentBadgeGrades" class="badge text-bg-secondary"></div>
        </div>
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
                <thead><tr>
                    <th>Przedmiot</th><th>Ocena</th><th>Data</th><th>Nauczyciel</th>
                </tr></thead>
                <tbody id="gradesTbody"></tbody>
            </table>
        </div>
    </div>
</template>

<template id="tpl-attendance">
    <div class="card-glass p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Frekwencja</h2>
            <div id="studentBadgeAttendance" class="badge text-bg-secondary"></div>
        </div>
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
                <thead><tr>
                    <th>Data</th><th>Przedmiot</th><th>Status</th><th>Nauczyciel</th>
                </tr></thead>
                <tbody id="attendanceTbody"></tbody>
            </table>
        </div>
    </div>
</template>

<template id="tpl-remarks">
    <div class="card-glass p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Uwagi</h2>
            <div id="studentBadgeRemarks" class="badge text-bg-secondary"></div>
        </div>
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
                <thead><tr>
                    <th>Data</th><th>Treść</th><th>Wystawił</th>
                </tr></thead>
                <tbody id="remarksTbody"></tbody>
            </table>
        </div>
    </div>
</template>

<div id="toasts"></div>

<script type="module">
    import { initThemeToggle, renderUserBanner } from '../js/common.js';
    import '../student/student.js';
    initThemeToggle();
    renderUserBanner({ hideAuthLinks: true });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
